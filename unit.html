<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter — Calculator Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23f3ecfd%22/><text x=%2250%22 y=%2265%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%232aab93%22 font-family=%22Arial%22>=</text></svg>">

<!-- Tailwind CSS (utility-first framework) -->
<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex items-start justify-center p-3 sm:p-4">

<div class="w-full max-w-5xl app-shell">

  <header class="text-center mb-4 sm:mb-6 relative">
    <span class="sparkle s1" style="left:8%; top:-6px;">✨</span>
    <span class="sparkle s2" style="right:10%; top:2px;">✨</span>
    <span class="sparkle s3" style="right:22%; bottom:-10px;">✦</span>
    <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-[#3d3557] tracking-wide">Calculator Hub</h1>
  </header>

  <a href="index.html" class="back-btn">← All calculators</a>

  <section>
    <div class="tool-card w-full max-w-md mx-auto flex flex-col gap-4">
      <h2 class="tool-title">Unit Converter</h2>
      <label class="tool-label">Category
        <select id="unitCategory" class="tool-input">
          <option value="length">Length</option>
          <option value="weight">Weight</option>
          <option value="temperature">Temperature</option>
        </select>
      </label>
      <div class="flex gap-2">
        <label class="tool-label flex-1">From
          <select id="unitFrom" class="tool-input"></select>
        </label>
        <label class="tool-label flex-1">To
          <select id="unitTo" class="tool-input"></select>
        </label>
      </div>
      <label class="tool-label">Value
        <input id="unitValue" type="number" step="any" class="tool-input" placeholder="e.g. 10">
      </label>
      <button id="unitCalcBtn" class="tool-btn-primary">Convert</button>
      <div id="unitResult" class="tool-result hidden"></div>
    </div>
  </section>

  <footer class="text-center mt-6 text-xs text-[#b3a8ce]">
    Built with semantic HTML, Flexbox + Grid, responsive media queries, CSS animations, Tailwind, and vanilla JavaScript.
  </footer>

</div>

<script src="shared.js"></script>
<script src="unit.js"></script>

</body>
</html>
