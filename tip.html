<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tip Calculator — Calculator Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23f3ecfd%22/><text x=%2250%22 y=%2265%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%232aab93%22 font-family=%22Arial%22>=</text></svg>">

<!-- Tailwind CSS (utility-first framework) -->
<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex items-start justify-center p-3 sm:p-4">

<div class="w-full max-w-5xl app-shell">

  <header class="text-center mb-4 sm:mb-6 relative">
    <span class="sparkle s1" style="left:8%; top:-6px;">✨</span>
    <span class="sparkle s2" style="right:10%; top:2px;">✨</span>
    <span class="sparkle s3" style="right:22%; bottom:-10px;">✦</span>
    <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-[#3d3557] tracking-wide">Calculator Hub</h1>
  </header>

  <a href="index.html" class="back-btn">← All calculators</a>

  <section>
    <div class="glass-wrap w-full max-w-md mx-auto">
      <div class="glass-card flex flex-col gap-4">
        <h2 class="glass-title">Tip Calculator</h2>

        <label class="glass-label">Bill amount
          <input id="tipBill" type="number" min="0" step="0.01" class="glass-input" placeholder="e.g. 1500">
        </label>

        <div class="glass-label">
          Tip %
          <div class="glass-chip-row" id="tipChipRow">
            <button type="button" class="glass-chip" data-tip="10">10%</button>
            <button type="button" class="glass-chip active" data-tip="15">15%</button>
            <button type="button" class="glass-chip" data-tip="18">18%</button>
            <button type="button" class="glass-chip" data-tip="20">20%</button>
          </div>
          <input id="tipCustom" type="number" min="0" step="0.1" class="glass-input mt-1" placeholder="or type a custom %">
        </div>

        <label class="glass-label">Split between how many people?
          <input id="tipPeople" type="number" min="1" step="1" value="1" class="glass-input">
        </label>

        <button id="tipCalcBtn" class="glass-btn-primary">Calculate Tip</button>

        <div id="tipResult" class="glass-result hidden"></div>
      </div>
    </div>
  </section>

  <footer class="text-center mt-6 text-xs text-[#b3a8ce]">
    Built with semantic HTML, Flexbox + Grid, responsive media queries, CSS animations, Tailwind, and vanilla JavaScript.
  </footer>

</div>

<script src="shared.js"></script>
<script src="tip.js"></script>

</body>
</html>
