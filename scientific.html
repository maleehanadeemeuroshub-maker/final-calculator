<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator — Calculator Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23f3ecfd%22/><text x=%2250%22 y=%2265%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%232aab93%22 font-family=%22Arial%22>=</text></svg>">

<!-- Tailwind CSS (utility-first framework) -->
<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex items-start justify-center p-3 sm:p-4">

<div class="w-full max-w-5xl app-shell">

  <header class="text-center mb-4 sm:mb-6 relative">
    <span class="sparkle s1" style="left:8%; top:-6px;">✨</span>
    <span class="sparkle s2" style="right:10%; top:2px;">✨</span>
    <span class="sparkle s3" style="right:22%; bottom:-10px;">✦</span>
    <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-[#3d3557] tracking-wide">Calculator Hub</h1>
  </header>

  <a href="index.html" class="back-btn">← All calculators</a>

  <main class="flex flex-col md:flex-row gap-5 items-start justify-center">

    <section aria-label="Scientific calculator" class="bg-white/80 backdrop-blur rounded-2xl p-3 sm:p-5 shadow-2xl w-full max-w-[380px] mx-auto md:mx-0 md:w-[380px] flex flex-col gap-3 sm:gap-4 border border-[#e8def7]">

      <div class="flex justify-end gap-2">
        <button id="degBtn" type="button" data-mode="deg"
          class="mode-btn relative overflow-hidden px-4 py-1.5 rounded-full text-xs font-bold border-2 border-violet-300 bg-violet-400 text-white">DEG</button>
        <button id="radBtn" type="button" data-mode="rad"
          class="mode-btn relative overflow-hidden px-4 py-1.5 rounded-full text-xs font-bold border-2 border-[#e8def7] bg-white/70 text-[#a89bc4]">RAD</button>
      </div>

      <div class="display-glow bg-white/85 rounded-xl p-4 text-right border border-[#e8def7] relative">
        <span id="memoryIndicator" class="absolute top-2 left-3 text-xs font-bold text-fuchsia-500 hidden">M</span>
        <div id="previousText" class="text-sm text-[#a89bc4] min-h-[18px]"></div>
        <div id="currentText" class="display-current text-3xl font-semibold text-[#3d3557] break-all">0</div>
      </div>

      <div class="grid grid-cols-6 gap-2">
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="sin">sin</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="cos">cos</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="tan">tan</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="log">log</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="ln">ln</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="sqrt">&radic;</button>

        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="pow2">x&sup2;</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-operator="^">x^y</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="fact">x!</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="inv">1/x</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-const="pi">&pi;</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-const="e">e</button>

        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="asin">sin&#8315;&sup1;</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="acos">cos&#8315;&sup1;</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="atan">tan&#8315;&sup1;</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="sinh">sinh</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="cosh">cosh</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="tanh">tanh</button>

        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-operator="%">mod</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="exp">EXP</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-action="ans">Ans</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-action="negate">+/&minus;</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="nthroot">&#8319;&radic;</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="rand">Rnd</button>

        <button class="calc-btn bg-fuchsia-200 hover:bg-fuchsia-300 text-[#6b2f56] rounded-lg text-xs" data-action="mc">MC</button>
        <button class="calc-btn bg-fuchsia-200 hover:bg-fuchsia-300 text-[#6b2f56] rounded-lg text-xs" data-action="mr">MR</button>
        <button class="calc-btn bg-fuchsia-200 hover:bg-fuchsia-300 text-[#6b2f56] rounded-lg text-xs" data-action="mplus">M+</button>
        <button class="calc-btn bg-fuchsia-200 hover:bg-fuchsia-300 text-[#6b2f56] rounded-lg text-xs" data-action="mminus">M&minus;</button>
        <button class="calc-btn bg-fuchsia-200 hover:bg-fuchsia-300 text-[#6b2f56] rounded-lg text-xs" data-action="copy">Copy</button>
        <button class="calc-btn bg-fuchsia-200 hover:bg-fuchsia-300 text-[#6b2f56] rounded-lg text-xs" data-action="paste">Paste</button>

        <button class="calc-btn bg-rose-200 hover:bg-rose-300 text-[#7a2540] rounded-lg text-sm font-semibold" data-action="clear">AC</button>
        <button class="calc-btn bg-rose-200 hover:bg-rose-300 text-[#7a2540] rounded-lg text-sm font-semibold" data-action="delete">DEL</button>
        <button class="calc-btn bg-white/80 hover:bg-[#f3ecfd] text-[#3d3557] rounded-lg border border-[#e8def7]" data-paren="(">(</button>
        <button class="calc-btn bg-white/80 hover:bg-[#f3ecfd] text-[#3d3557] rounded-lg border border-[#e8def7]" data-paren=")">)</button>
        <button class="calc-btn bg-amber-300 hover:bg-amber-200 text-[#5b3d12] font-semibold rounded-lg" data-operator="/">&divide;</button>
        <button class="calc-btn bg-amber-300 hover:bg-amber-200 text-[#5b3d12] font-semibold rounded-lg" data-operator="*">&times;</button>

        <button class="calc-btn bg-white/80 hover:bg-[#f3ecfd] text-[#3d3557] rounded-lg border border-[#e8def7]" data-number="7">7</button>
        <button class="calc-btn bg-white/80 hover:bg-[#f3ecfd] text-[#3d3557] rounded-lg border border-[#e8def7]" data-number="8">8</button>
        <button class="calc-btn bg-white/80 hover:bg-[#f3ecfd] text-[#3d3557] rounded-lg border border-[#e8def7]" data-number="9">9</button>
        <button class="calc-btn bg-amber-300 hover:bg-amber-200 text-[#5b3d12] font-semibold rounded-lg" data-operator="-">&minus;</button>
        <button class="calc-btn bg-violet-200 hover:bg-violet-300 text-[#4a3f6b] rounded-lg text-xs" data-func="percent">%</button>
        <button id="equalsBtn" class="calc-btn row-span-2 bg-teal-300 hover:bg-teal-200 text-[#0f4a42] font-bold rounded-lg text-xl" data-action="equals">=</button>

        <button class="calc-btn bg-white/80 hover:bg-[#f3ecfd] text-[#3d3557] rounded-lg border border-[#e8def7]" data-number="4">4</button>
        <button class="calc-btn bg-white/80 hover:bg-[#f3ecfd] text-[#3d3557] rounded-lg border border-[#e8def7]" data-number="5">5</button>
        <button class="calc-btn bg-white/80 hover:bg-[#f3ecfd] text-[#3d3557] rounded-lg border border-[#e8def7]" data-number="6">6</button>
        <button class="calc-btn bg-amber-300 hover:bg-amber-200 text-[#5b3d12] font-semibold rounded-lg" data-operator="+">+</button>
        <button class="calc-btn bg-white/80 hover:bg-[#f3ecfd] text-[#3d3557] rounded-lg border border-[#e8def7]" data-number=".">.</button>

        <button class="calc-btn bg-white/80 hover:bg-[#f3ecfd] text-[#3d3557] rounded-lg border border-[#e8def7]" data-number="1">1</button>
        <button class="calc-btn bg-white/80 hover:bg-[#f3ecfd] text-[#3d3557] rounded-lg border border-[#e8def7]" data-number="2">2</button>
        <button class="calc-btn bg-white/80 hover:bg-[#f3ecfd] text-[#3d3557] rounded-lg border border-[#e8def7]" data-number="3">3</button>
        <button class="calc-btn col-span-3 bg-white/80 hover:bg-[#f3ecfd] text-[#3d3557] rounded-lg border border-[#e8def7]" data-number="0">0</button>
      </div>

      <form id="quickForm" novalidate class="flex flex-col gap-1 pt-2 border-t border-[#efe6fb]">
        <label for="quickInput" class="text-xs text-[#8b7fa8]">Quick calc (type an expression &amp; press Enter)</label>
        <input
          id="quickInput"
          type="text"
          required
          pattern="^[0-9+\-*/().%\s]+$"
          placeholder="e.g. (12+8)/4"
          class="bg-white/80 text-[#3d3557] rounded-lg px-3 py-2 text-base outline-none border border-[#e8def7] focus:border-violet-400"
        />
        <span id="formError" class="text-xs text-rose-500 hidden">Only numbers and + &minus; &times; &divide; % ( ) are allowed.</span>
      </form>
    </section>

    <section aria-label="Calculation history" class="history-panel bg-white/80 backdrop-blur rounded-2xl p-3 sm:p-5 shadow-2xl w-full max-w-[380px] mx-auto md:mx-0 md:w-[280px] flex flex-col gap-3 max-h-[220px] md:max-h-[520px] border border-[#e8def7]">
      <div class="flex items-center justify-between">
        <h2 class="text-[#3d3557] font-semibold text-sm">History</h2>
        <button id="clearHistoryBtn" type="button" class="text-xs text-rose-500 hover:text-rose-600">Clear</button>
      </div>
      <ul id="historyList" class="flex flex-col gap-2 overflow-y-auto pr-1 text-sm">
        <li class="text-[#b3a8ce] text-xs italic" id="emptyHistoryMsg">No calculations yet.</li>
      </ul>
    </section>
  </main>

  <footer class="text-center mt-6 text-xs text-[#b3a8ce]">
    Built with semantic HTML, Flexbox + Grid, responsive media queries, CSS animations, Tailwind, and vanilla JavaScript.
  </footer>

</div>

<script src="shared.js"></script>
<script src="scientific.js"></script>

</body>
</html>
